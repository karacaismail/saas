name: Verify and publish SaaS Atlas
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Verify browser shard
        env:
          ATLAS_SHARD: ${{ matrix.shard }}
          ATLAS_BROWSER: ${{ matrix.browser }}
        run: |
          atlas_browser_workers=3
          if [ "$ATLAS_BROWSER" = "firefox" ]; then
            atlas_browser_workers=1
          fi
          PLAYWRIGHT_HTML_REPORT="playwright-report/$ATLAS_BROWSER" npm run test:browser -- --project="$ATLAS_BROWSER" --workers="$atlas_browser_workers" --shard="$ATLAS_SHARD/3" --output="test-results/$ATLAS_BROWSER"
          if [ "$ATLAS_BROWSER" = "chromium" ] && [ "$ATLAS_SHARD" = "1" ]; then
            PLAYWRIGHT_HTML_REPORT=playwright-report/input npm run test:browser -- --project=chromium-touch --project=webkit-touch --project=chromium-hybrid --output=test-results/input
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: browser-evidence-${{ matrix.browser }}-shard-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: matrix.browser == 'chromium' && matrix.shard == 1 && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
